<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Miyo ChatGPT qualification</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main aria-labelledby="title">
      <h1 id="title">Miyo ChatGPT qualification</h1>
      <p id="status" role="status" aria-live="polite">Checking qualification status…</p>
      <button id="check-connection" type="button">Check local connection</button>
      <p id="connection-status" role="status" aria-live="polite">Local connection has not been checked.</p>
      <button id="start" type="button" disabled>Start selected probe</button>
      <p class="note">The connection check reads only local transport status. It does not access ChatGPT or enable capture.</p>
    </main>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
